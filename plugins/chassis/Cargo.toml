[package]
name = "chassis"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Robot-voice rig: pitch and formant shift, a three-way split with sub, ring mod, vocoder, shifter, comb, shine and plate, then glue and a true-peak limiter"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
