[package]
name = "firefly"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Opto compressor: a lamp lights a photocell that remembers how hard it worked"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
