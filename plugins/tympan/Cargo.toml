[package]
name = "tympan"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Physically modelled drum kit: four drumheads solved as a 2D wave equation, a modal shell and snare wires, drawn as the heads seen from above"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
