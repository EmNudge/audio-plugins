[package]
name = "digger"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Crate-digging drum sampler: eight drum slots, a folder of your own WAVs sorted by category, and keyboard or MIDI browsing while the groove plays"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
