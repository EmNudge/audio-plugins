[package]
name = "abacus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sine resynthesiser: tracks the strongest partials of the input and rebuilds them on a bank of oscillators, an open answer to Grinder"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }
spectral = { path = "../../crates/spectral" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
