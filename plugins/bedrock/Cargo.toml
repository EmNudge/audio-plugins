[package]
name = "bedrock"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Low-end exciter, the counterpart of Aurora Air: harmonics and a tracked octave-down grown from the bass, drawn as magma under a mountain ridge"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
