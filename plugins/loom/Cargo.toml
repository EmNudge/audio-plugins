[package]
name = "loom"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Spectral playheads that read a scrolling spectrogram at their own delay, pitch and band, drawn as a loom"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { workspace = true, features = ["assert_process_allocs", "vst3"] }
nih_plug_egui.workspace = true
preset_kit = { path = "../../crates/preset_kit" }
spectral = { path = "../../crates/spectral" }

[dev-dependencies]
ui_preview = { path = "../../crates/ui_preview" }
